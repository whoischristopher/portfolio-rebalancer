# Weekly update PRs, opened against develop. CI must pass before merging.
version: 2
updates:
  # Python packages: regenerates requirements.txt from requirements.in (pip-compile, with hashes).
  - package-ecosystem: pip
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: saturday
      time: "08:00"
      timezone: America/Toronto
    open-pull-requests-limit: 5
    groups:
      # One PR for all routine minor/patch bumps; major bumps stay separate so they're reviewed alone.
      python-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  # Base image (python:3.13-slim) – Python patch releases and new minors.
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: saturday
      time: "08:00"
      timezone: America/Toronto
    labels: [dependencies]

  # The actions used by CI.
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies]
